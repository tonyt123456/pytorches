name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Linux builds inside the manylinux container (see before-script-linux); others build on the host.
      - name: Stage plugins
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/stage-plugins.sh
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          before-script-linux: bash ../../scripts/stage-plugins.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/python/dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
